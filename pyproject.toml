[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "code-as-memory"
version = "0.1.0"
description = "Robot Memory: develop and evaluate reusable robot programs"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy>=1.26,<2", "scipy>=1.11", "h5py>=3.10", "Pillow>=10", "imageio[ffmpeg]>=2.34", "opencv-python>=4.9,<4.12"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]
data = ["huggingface_hub>=1,<3"]

[project.scripts]
cam = "cam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["cam.legacy", "cam.legacy.*"]

[tool.setuptools.package-data]
cam = ["prompts/**/*.md", "prompts/*.md", "interface/**/*.md", "interface/**/*.json", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: real benchmark simulator checks", "isolation: Linux bubblewrap checks"]
