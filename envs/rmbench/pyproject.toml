[project]
name = "cam-env-rmbench"
version = "0.1.0"
description = "Pinned simulator environment for the CaM RMBench adapter (RoboTwin 2.0, SAPIEN ray tracing, CuRobo)"
requires-python = "==3.10.*"
# Versions follow third_party/rmbench/scripts/requirements.txt. Instruction-generation
# extras (openai, azure, the unrelated PyPI `ffmpeg`, wandb) and the optional pytorch3d
# point-cloud sampler are omitted; CuRobo v0.7.8 is built by install.sh after sync.
dependencies = [
  "torch==2.4.1",
  "torchvision==0.19.1",
  "transforms3d==0.4.2",
  "sapien==3.0.0b1",
  "scipy==1.10.1",
  "mplib==0.2.1",
  "gymnasium==0.29.1",
  "trimesh==4.4.3",
  "open3d==0.18.0",
  # Required by the Linux Open3D wheel; absent from its cross-platform lock metadata.
  "ipywidgets==8.1.8",
  "imageio==2.34.2",
  "imageio-ffmpeg==0.5.1",
  "pydantic==2.9.2",
  "zarr==2.18.3",
  "huggingface_hub==0.25.0",
  "h5py==3.12.1",
  "pyglet<2",
  "moviepy==1.0.3",
  "termcolor==2.5.0",
  "av==13.1.0",
  "matplotlib==3.9.2",
  "opencv-python==4.10.0.84",
  "PyYAML==6.0.2",
  "warp-lang==1.12.0",
  "setuptools==69.5.1",
  "ninja==1.11.1.1",
  "numpy==1.26.4",
  # CuRobo v0.7.8 runtime/build requirements (setup.cfg install_requires); CuRobo
  # itself is built from source by install.sh with --no-deps.
  "pybind11==2.13.6",
  "numpy-quaternion==2023.0.4",
  "setuptools-scm==8.1.0",
  "yourdfpy==0.0.56",
  "wheel==0.44.0",
  "importlib-resources==6.4.5",
  "scikit-image==0.24.0",
]

[tool.uv]
package = false
